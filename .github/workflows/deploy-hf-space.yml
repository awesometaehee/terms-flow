# main에 앱 코드가 바뀌어 올라오면 Hugging Face Space로 배포한다 (Space가 Dockerfile로 다시 빌드한다).
# 설정 전에는 아무것도 하지 않는다: 저장소 Settings → Secrets and variables → Actions 에
#   Variable HF_SPACE  = <HF 사용자 또는 조직>/<Space 이름>   (예: my-team/kms-review)
#   Secret   HF_TOKEN  = 그 Space에 쓰기 권한이 있는 Hugging Face 토큰
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "schemas/**"
      - "deploy/hf/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Space 파일 모으기
        run: bash deploy/hf/assemble.sh "$RUNNER_TEMP/space"

      - name: Space로 올리기
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd "$RUNNER_TEMP/space"
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          # Space 저장소는 배포 결과물이라 매번 덮어쓴다.
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
